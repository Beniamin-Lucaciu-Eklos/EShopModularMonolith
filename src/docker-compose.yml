services:
  eshopdb:
    image: postgres:16
    container_name: eshopdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=pa55w0rd
      - POSTGRES_DB=${POSTGRES_DB:-EShopDb}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.8.0
    container_name: redis_Eshop
    command: redis-server --requirepass pa66w1rd --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=pa66w1rd
   
  seq:
     image: datalust/seq:latest
     environment:
       - ACCEPT_EULA=Y
       - SEQ_FIRSTRUN_ADMINPASSWORD=pa55w0rdAdi
     restart: unless-stopped
     ports:
       - "5341:5341"
       - "9091:80"
     volumes:
       - seq_data:$HOST_PATH_TO_SEQ/data

  RabbitMq:
     image: rabbitmq:3-management
     hostname: ecommerce-mq
     container_name: Rabbitmq
     environment:
       - RABBITMQ_DEFAULT_USER=guest
       - RABBITMQ_DEFAULT_PASS=guest
     ports:
       - "5672:5672"
       - "15672:15672"
     restart: unless-stopped

  identity:
    container_name: identity
    image: quay.io/keycloak/keycloak:24.0.3
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://host.docker.internal:5432/EShopDb?currentSchema=identity
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=pa55w0rd
    restart: unless-stopped
    ports:
      - "9090:8080"
    command:
      - start-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  seq_data:
