services:
  eshopdb:
    image: postgres:16
    container_name: eshopdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=pa55w0rd
      - POSTGRES_DB=${POSTGRES_DB:-EShopDb}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  

volumes:
  postgres_data:
