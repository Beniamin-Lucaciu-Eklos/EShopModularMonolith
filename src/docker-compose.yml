services:
  eshopdb:
    image: postgres:16
    container_name: eshopdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=pa55w0rd
      - POSTGRES_DB=${POSTGRES_DB:-EShopDb}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.8.0
    container_name: redis_Eshop
    command: redis-server --requirepass pa66w1rd --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=pa66w1rd
   
  seq:
     image: datalust/seq:latest
     environment:
       - ACCEPT_EULA=Y
       - SEQ_FIRSTRUN_ADMINPASSWORD=pa55w0rdAdi
     restart: unless-stopped
     ports:
       - "5341:5341"
       - "9091:80"
     volumes:
       - seq_data:$HOST_PATH_TO_SEQ/data

volumes:
  postgres_data:
  redis_data:
  seq_data:
